<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Даша и Влад — приглашение</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Arial, sans-serif; background: #fff; }
    .app { position: relative; width: 100%; min-height: 100svh; overflow: hidden; }
    .screen { position: absolute; inset: 0; min-height: 100svh; display: grid; place-items: center; background: #fff; transition: opacity .55s ease, transform .55s ease; }
    .screen img { display: block; width: min(100%, 420px); max-height: 100svh; object-fit: contain; }
    .cover { cursor: pointer; z-index: 2; }
    .cover:focus-visible { outline: 3px solid #dc0011; outline-offset: -5px; }
    .details { opacity: 0; transform: translateY(22px); pointer-events: none; z-index: 1; }
    .app.open .cover { opacity: 0; transform: translateY(-18px); pointer-events: none; }
    .app.open .details { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .hint { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .12em; color: #777; animation: pulse 2s ease-in-out infinite; }
    .back { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; border: 0; border-radius: 999px; background: #fff9; padding: 9px 13px; font-size: 14px; color: #222; cursor: pointer; z-index: 3; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .screen { transition: none; } .hint { animation: none; } }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="screen cover" id="cover" tabindex="0" role="button" aria-label="Открыть приглашение">
      <img src="cover.png" alt="Даша и Влад — красное сердце">
      <span class="hint">НАЖМИТЕ, ЧТОБЫ ОТКРЫТЬ</span>
    </section>
    <section class="screen details" id="details" aria-label="Приглашение на свадьбу" aria-hidden="true">
      <button class="back" id="back" type="button" aria-label="Вернуться к обложке">← Назад</button>
      <img src="invitation.png" alt="Дорогие родители! Приглашаем вас разделить с нами этот особенный день — день свадьбы! 7 августа 2027, 14:20, Иркутск, ул. Декабрьских Событий, 106">
    </section>
  </main>
  <script>
    const app = document.getElementById('app');
    const cover = document.getElementById('cover');
    const details = document.getElementById('details');
    const back = document.getElementById('back');
    function setOpen(open) {
      app.classList.toggle('open', open);
      cover.setAttribute('aria-hidden', String(open));
      cover.tabIndex = open ? -1 : 0;
      details.setAttribute('aria-hidden', String(!open));
      back.tabIndex = open ? 0 : -1;
    }
    cover.addEventListener('click', () => setOpen(true));
    cover.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(true); } });
    back.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
    setOpen(false);
  </script>
</body>
</html>
